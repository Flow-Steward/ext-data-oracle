{
  "actions": [
    {
      "action_id": "query",
      "workflow_visible": true,
      "title": "Oracle: Read rows with a SELECT query",
      "description": "Read up to 100 rows from one bounded SELECT, for example approved orders for a later workflow step. Select an Oracle project connection configured with its host, service name and secret username/password. Example SQL: SELECT order_id, status FROM orders WHERE status = :1. Pass values in a JSON array corresponding to :1, :2 and subsequent positional binds. The action does not modify database rows.",
      "required_scopes": [
        "extension:invoke"
      ],
      "handler": {
        "mode": "extension"
      },
      "parameters": [
        {
          "name": "connection_ref",
          "type": "string",
          "required": true,
          "description": "Select an Oracle project connection configured with its host, service name and secret username/password."
        },
        {
          "name": "statement",
          "type": "string",
          "required": true,
          "description": "Enter one bounded SELECT. Example: SELECT order_id, status FROM orders WHERE status = :1"
        },
        {
          "name": "parameters",
          "type": "json",
          "required": false,
          "description": "Supply values in placeholder order: :1 is the first array item, :2 the second. Values are bound separately from SQL. Example: [\"approved\"]"
        },
        {
          "name": "max_rows",
          "type": "integer",
          "required": false,
          "description": "Read 1 to 100 rows; default 100. Use 10 for an initial preview. This bounds returned data, not a pagination cursor."
        }
      ],
      "result_fields": [
        "result.records",
        "result.count",
        "result.applied"
      ],
      "error_codes": [
        "invalid_payload",
        "invalid_connection",
        "write_disabled",
        "effect_claim_required",
        "test_mode_suppressed",
        "provider_unavailable",
        "native_unavailable",
        "invalid_provider_response",
        "response_too_large",
        "network_blocked",
        "timeout",
        "authentication_failed"
      ],
      "mutates_platform": false
    },
    {
      "action_id": "execute_sql",
      "workflow_visible": true,
      "title": "Oracle: Insert, update, delete or merge rows",
      "description": "Write workflow results using one INSERT, UPDATE, DELETE or MERGE. Select an Oracle project connection configured with its host, service name and secret username/password. Enable allow_writes on the connection and grant its user permission to modify the target table. Example SQL: UPDATE orders SET status = :1 WHERE order_id = :2. Pass values in a JSON array corresponding to :1, :2 and subsequent positional binds. Test mode suppresses writes.",
      "required_scopes": [
        "extension:invoke"
      ],
      "handler": {
        "mode": "extension"
      },
      "parameters": [
        {
          "name": "connection_ref",
          "type": "string",
          "required": true,
          "description": "Select an Oracle project connection configured with its host, service name and secret username/password. Enable allow_writes on the connection and grant its user permission to modify the target table."
        },
        {
          "name": "statement",
          "type": "string",
          "required": true,
          "description": "Enter one supported write statement. Example: UPDATE orders SET status = :1 WHERE order_id = :2"
        },
        {
          "name": "parameters",
          "type": "json",
          "required": false,
          "description": "Supply values in placeholder order: :1 is the first array item, :2 the second. Values are bound separately from SQL. Example: [\"approved\",1042]"
        }
      ],
      "result_fields": [
        "result.records",
        "result.count",
        "result.applied"
      ],
      "error_codes": [
        "invalid_payload",
        "invalid_connection",
        "write_disabled",
        "effect_claim_required",
        "test_mode_suppressed",
        "provider_unavailable",
        "native_unavailable",
        "invalid_provider_response",
        "response_too_large",
        "network_blocked",
        "timeout",
        "authentication_failed"
      ],
      "mutates_platform": false
    },

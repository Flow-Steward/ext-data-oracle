{
  "operations": [
    {
      "operation_id": "query",
      "display_name": "Query Oracle",
      "description": "One bounded SELECT with positional :1 binds.",
      "operation_kind": "action",
      "workflow_visible": true,
      "connection_type_ids": [
        "oracle"
      ],
      "category": "data",
      "inputs": [
        {
          "name": "connection_ref",
          "value_type": "connection_ref",
          "required": true,
          "display_name": "Connection"
        },
        {
          "name": "statement",
          "value_type": "text",
          "required": true,
          "display_name": "SQL statement",
          "schema": {
            "type": "string",
            "minLength": 1,
            "maxLength": 32768
          }
        },
        {
          "name": "parameters",
          "value_type": "json",
          "required": false,
          "display_name": "Positional bind values",
          "schema": {
            "type": "array",
            "maxItems": 100
          }
        },
        {
          "name": "max_rows",
          "value_type": "integer",
          "required": false,
          "display_name": "Maximum rows",
          "schema": {
            "type": "integer",
            "minimum": 1,
            "maximum": 100,
            "default": 100
          }
        }
      ],
      "outputs": [
        {
          "name": "records",
          "value_type": "json"
        },
        {
          "name": "count",
          "value_type": "integer"
        },
        {
          "name": "applied",
          "value_type": "boolean"
        }
      ],
      "result_fields": [
        "result.records",
        "result.count",
        "result.applied"
      ],
      "error_codes": [
        "invalid_payload",
        "invalid_connection",
        "write_disabled",
        "effect_claim_required",
        "test_mode_suppressed",
        "provider_unavailable",
        "native_unavailable",
        "invalid_provider_response",
        "response_too_large",
        "network_blocked",
        "timeout",
        "authentication_failed"
      ]
    },

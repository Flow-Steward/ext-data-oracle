{
  "schema_version": "extension_descriptor_v1",
  "lifecycle": {
    "data_schema_version": 1,
    "data_migrations": []
  },
  "extension_id": "flowsteward.oracle",
  "release_version": "1.1.2",
  "extension_type": "service_extension",
  "identity": {
    "display_name": "Oracle",
    "description": "Bounded Oracle SELECT and opted-in DML with native bind parameters through Google MCP Toolbox.",
    "tags": [
      "oracle",
      "sql",
      "toolbox"
    ]
  },
  "vendor": {
    "vendor_name": "Flow Steward"
  },
  "listing": {
    "visibility": "public_reference",
    "category": "data"
  },
  "distribution": {
    "channel": "private_byo",
    "execution_modes": [
      "local"
    ],
    "allows_self_hosted": true,
    "requires_connected_control_plane": false,
    "import_sources": [
      "file"
    ]
  },
  "runtime": {
    "contract_version": "extension_host_v2",
    "compatibility": {
      "platform_min": "1.4.0"
    },
    "extension_contract_v2": {
      "connection_types": "contracts/connection_types.yaml",
      "operation_manifest": "contracts/operation_manifest.yaml",
      "step_ui_manifest": "contracts/step_ui_manifest.yaml",
      "dataset_connectors": [
        {
          "connector_id": "oracle",
          "connector_type_id": "oracle",
          "database_kind": "oracle",
          "display_name": "Oracle",
          "description": "Bounded read-only Oracle schema inspection and saved single-table SQL queries.",
          "source_kind": "oracle",
          "source_extension_id": "flowsteward.oracle",
          "source_extension_name": "Oracle",
          "source_provider": "Oracle",
          "query_language": "sql",
          "access_mode": "read_only",
          "runtime_kind": "local_extension",
          "runtime_adapter_ref": "main.py",
          "connector_catalog": [
            {
              "source_kind": "oracle",
              "connector_type_id": "oracle",
              "display_name": "Oracle",
              "query_language": "sql",
              "preset_config": {}
            }
          ],
          "connection_schema": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "host",
              "service_name"
            ],
            "properties": {
              "host": {
                "type": "string",
                "minLength": 1,
                "maxLength": 253,
                "title": "Server hostname or IP"
              },
              "port": {
                "type": "integer",
                "minimum": 1,
                "maximum": 65535,
                "default": 1521
              },
              "tls": {
                "type": "boolean",
                "default": true
              },
              "request_timeout_seconds": {
                "type": "integer",
                "minimum": 1,
                "maximum": 30,
                "default": 15
              },
              "service_name": {
                "type": "string",
                "minLength": 1,
                "maxLength": 128
              },
              "allow_writes": {
                "type": "boolean",
                "default": false
              }
            }
          },
          "secret_schema": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "username",
              "password"
            ],
            "properties": {
              "username": {
                "type": "string",
                "minLength": 1,
                "maxLength": 8192,
                "title": "Username"
              },
              "password": {
                "type": "string",
                "minLength": 1,
                "maxLength": 8192,
                "title": "Password"
              }
            }
          },
          "capabilities": {
            "read_only": true,
            "test_connection": true,
            "schema_introspection": true,
            "validate_query": true,
            "preview_query": true,
            "execute_template": true,
            "infer_output_schema": true,
            "write_queries": false,
            "row_preview": true
          },
          "safety_profile": {
            "access_mode": "read_only",
            "indexes_rows": false,
            "executes_write_queries": false,
            "requires_saved_template": true
          },
          "preview_support": true,
          "schema_refresh_support": true
        }
      ],
      "resource_query_manifest": [
        {
          "query_id": "runtime_health",
          "cursor_mode": "none",
          "description": "Oracle runtime health.",
          "required_scopes": [
            "extension:invoke"
          ],
          "result_fields": [
            "result.status",
            "result.extension_id"
          ],
          "error_codes": [
            "invalid_payload"
          ]
        },
        {
          "query_id": "supported_connectors",
          "cursor_mode": "none",
          "description": "Oracle supported connectors.",
          "required_scopes": [
            "extension:invoke"
          ],
          "result_fields": [
            "result.connectors"
          ],
          "error_codes": [
            "invalid_payload"
          ]
        }
      ]
    }
  }
}
